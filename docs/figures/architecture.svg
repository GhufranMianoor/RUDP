<polyline points="262,485 362,392 450,378 545,378 705,378 895,378 1055,378 1150,378 1250,392 1338,485" fill="none" stroke="#d9730d" stroke-width="3" stroke-linejoin="round" marker-end="url(#ao)" />
<rect x="70" y="150" width="190" height="110" rx="10" fill="#e8f0fc" stroke="#1f5fbf" stroke-width="2" />
<text x="165.0" y="178" font-size="20" font-weight="bold" fill="#1b1f24" text-anchor="middle" >h1</text>
<text x="165.0" y="200" font-size="15" font-weight="bold" fill="#1b1f24" text-anchor="middle" >10.0.1.10/24</text>
<text x="165.0" y="220" font-size="12.5" font-weight="normal" fill="#3b4148" text-anchor="middle" >RUDP sender (Python)</text>
<text x="165.0" y="237" font-size="12.5" font-weight="normal" fill="#3b4148" text-anchor="middle" >UDP src: ephemeral</text>
<text x="165.0" y="254" font-size="12.5" font-weight="normal" fill="#3b4148" text-anchor="middle" >dst: 10.0.3.10 : 9000</text>
<rect x="70" y="420" width="190" height="110" rx="10" fill="#fdf0e3" stroke="#d9730d" stroke-width="2" />
<text x="165.0" y="448" font-size="20" font-weight="bold" fill="#1b1f24" text-anchor="middle" >h3</text>
<text x="165.0" y="470" font-size="15" font-weight="bold" fill="#1b1f24" text-anchor="middle" >10.0.1.11/24</text>
<text x="165.0" y="490" font-size="12.5" font-weight="normal" fill="#3b4148" text-anchor="middle" >iperf3 TCP client</text>
<text x="165.0" y="507" font-size="12.5" font-weight="normal" fill="#3b4148" text-anchor="middle" >TCP src: ephemeral</text>
<text x="165.0" y="524" font-size="12.5" font-weight="normal" fill="#3b4148" text-anchor="middle" >dst: 10.0.3.11 : 5201</text>
<rect x="1340" y="150" width="190" height="110" rx="10" fill="#e8f0fc" stroke="#1f5fbf" stroke-width="2" />
<text x="1435.0" y="178" font-size="20" font-weight="bold" fill="#1b1f24" text-anchor="middle" >h2</text>
<text x="1435.0" y="200" font-size="15" font-weight="bold" fill="#1b1f24" text-anchor="middle" >10.0.3.10/24</text>
<text x="1435.0" y="220" font-size="12.5" font-weight="normal" fill="#3b4148" text-anchor="middle" >RUDP receiver (Python)</text>
<text x="1435.0" y="237" font-size="12.5" font-weight="normal" fill="#3b4148" text-anchor="middle" >UDP dst port 9000</text>
<text x="1435.0" y="254" font-size="12.5" font-weight="normal" fill="#3b4148" text-anchor="middle" >ACK/SACK back to h1</text>
<rect x="1340" y="420" width="190" height="110" rx="10" fill="#fdf0e3" stroke="#d9730d" stroke-width="2" />
<text x="1435.0" y="448" font-size="20" font-weight="bold" fill="#1b1f24" text-anchor="middle" >h4</text>
<text x="1435.0" y="470" font-size="15" font-weight="bold" fill="#1b1f24" text-anchor="middle" >10.0.3.11/24</text>
<text x="1435.0" y="490" font-size="12.5" font-weight="normal" fill="#3b4148" text-anchor="middle" >iperf3 TCP server</text>
<text x="1435.0" y="507" font-size="12.5" font-weight="normal" fill="#3b4148" text-anchor="middle" >TCP listen port 5201</text>
<text x="1435.0" y="524" font-size="12.5" font-weight="normal" fill="#3b4148" text-anchor="middle" >(Reno / CUBIC)</text>
<rect x="360" y="325" width="100" height="80" rx="10" fill="#eef7ee" stroke="#2e8b57" stroke-width="2" />
<text x="410" y="357" font-size="20" font-weight="bold" fill="#1b1f24" text-anchor="middle" >sA</text>
<text x="410" y="378" font-size="12.5" font-weight="normal" fill="#3b4148" text-anchor="middle" >OVS switch</text>
<text x="410" y="394" font-size="12.5" font-weight="normal" fill="#3b4148" text-anchor="middle" >L2 bridge</text>
<rect x="1150" y="325" width="100" height="80" rx="10" fill="#eef7ee" stroke="#2e8b57" stroke-width="2" />
<text x="1200" y="357" font-size="20" font-weight="bold" fill="#1b1f24" text-anchor="middle" >sC</text>
<text x="1200" y="378" font-size="12.5" font-weight="normal" fill="#3b4148" text-anchor="middle" >OVS switch</text>
<text x="1200" y="394" font-size="12.5" font-weight="normal" fill="#3b4148" text-anchor="middle" >L2 bridge</text>
<rect x="545" y="315" width="160" height="100" rx="12" fill="#f0eefb" stroke="#6a5acd" stroke-width="3" />
<text x="625" y="342" font-size="21" font-weight="bold" fill="#1b1f24" text-anchor="middle" >R1</text>
<text x="625" y="362" font-size="13" font-weight="normal" fill="#3b4148" text-anchor="middle" >Linux router</text>
<text x="625" y="380" font-size="12" font-weight="normal" fill="#3b4148" text-anchor="middle" >ip_forward=1, static routes</text>
<text x="549" y="408" font-size="12.5" font-weight="bold" fill="#44388f" text-anchor="start" >10.0.1.1</text>
<text x="701" y="408" font-size="12.5" font-weight="bold" fill="#44388f" text-anchor="end" >10.0.2.1</text>
<rect x="895" y="315" width="160" height="100" rx="12" fill="#f0eefb" stroke="#6a5acd" stroke-width="3" />
<text x="975" y="342" font-size="21" font-weight="bold" fill="#1b1f24" text-anchor="middle" >R2</text>
<text x="975" y="362" font-size="13" font-weight="normal" fill="#3b4148" text-anchor="middle" >Linux router</text>
<text x="975" y="380" font-size="12" font-weight="normal" fill="#3b4148" text-anchor="middle" >ip_forward=1, static routes</text>
<text x="899" y="408" font-size="12.5" font-weight="bold" fill="#44388f" text-anchor="start" >10.0.2.2</text>
<text x="1051" y="408" font-size="12.5" font-weight="bold" fill="#44388f" text-anchor="end" >10.0.3.1</text>
<text x="640" y="336" font-size="1" font-weight="normal" fill="#1b1f24" text-anchor="middle" ></text>
<rect x="640" y="470" width="340" height="112" rx="10" fill="#fff4e0" stroke="#d9a441" stroke-width="2" />
<text x="810" y="494" font-size="14" font-weight="bold" fill="#7a4a00" text-anchor="middle" >Bottleneck impairment (tc, on both egress ports)</text>
<text x="810" y="516" font-size="12.5" font-weight="normal" fill="#3b4148" text-anchor="middle" >netem: delay D one-way (RTT = 2D), loss P per direction</text>
<text x="810" y="535" font-size="12.5" font-weight="normal" fill="#3b4148" text-anchor="middle" >tbf: rate 5 / 10 / 20 Mbit/s, drop-tail queue 100 packets</text>
<text x="810" y="554" font-size="12.5" font-weight="normal" fill="#3b4148" text-anchor="middle" >D = 10 / 50 / 100 ms,  P = 0 / 2 / 5 %</text>
<polyline points="810,470 810,440" fill="none" stroke="#d9a441" stroke-width="2" stroke-linejoin="round"  />
<rect x="545" y="120" width="220" height="70" rx="10" fill="#eef7ee" stroke="#2e8b57" stroke-width="2" />
<text x="655" y="142" font-size="14" font-weight="bold" fill="#1f6b43" text-anchor="middle" >Packet capture point</text>
<text x="655" y="160" font-size="12.5" font-weight="normal" fill="#3b4148" text-anchor="middle" >inside R1, LAN-side interface</text>
<text x="655" y="176" font-size="12" font-weight="normal" fill="#3b4148" text-anchor="middle" >filter: udp port 9000, saved as .pcapng</text>
<polyline points="655,190 600,316" fill="none" stroke="#2e8b57" stroke-width="2" stroke-linejoin="round" marker-end="url(#ag)" stroke-dasharray="5 4"/>
<text x="810" y="345" font-size="13" font-weight="bold" fill="#1f5fbf" text-anchor="middle" >RUDP flow  -></text>
<text x="810" y="396" font-size="13" font-weight="bold" fill="#d9730d" text-anchor="middle" >TCP flow  -></text>
<rect x="30" y="590" width="1540" height="130" rx="10" fill="#ffffff" stroke="#c9ced6" stroke-width="1.5" />
<text x="60" y="618" font-size="17" font-weight="bold" fill="#1b1f24" text-anchor="start" >Major flows and protocols</text>
<polyline points="60,645 130,645" fill="none" stroke="#1f5fbf" stroke-width="4" stroke-linejoin="round" marker-end="url(#ab)" />
<text x="145" y="650" font-size="13.5" font-weight="normal" fill="#1b1f24" text-anchor="start" >RUDP file transfer h1 -> h2:  DATA/FIN h1 -> h2, ACK + SACK h2 -> h1 (UDP port 9000).  SYN, SYN+ACK, ACK handshake; FIN, FIN+ACK teardown.</text>
<polyline points="60,672 130,672" fill="none" stroke="#d9730d" stroke-width="4" stroke-linejoin="round" marker-end="url(#ao)" />
<text x="145" y="677" font-size="13.5" font-weight="normal" fill="#1b1f24" text-anchor="start" >TCP baseline and fairness flow h3 -> h4 (iperf3, TCP port 5201, Reno or CUBIC); shares the same R1-R2 bottleneck as RUDP.</text>
<polyline points="60,699 130,699" fill="none" stroke="#2e8b57" stroke-width="3" stroke-linejoin="round" marker-end="url(#ag)" stroke-dasharray="5 4"/>
<text x="145" y="704" font-size="13.5" font-weight="normal" fill="#1b1f24" text-anchor="start" >Verification: ICMP ping and traceroute h1 -> h2 show the path 10.0.1.1 -> 10.0.2.2 -> 10.0.3.10 (every packet crosses both routers).</text>
<rect x="30" y="740" width="780" height="120" rx="10" fill="#ffffff" stroke="#c9ced6" stroke-width="1.5" />
<text x="60" y="766" font-size="16" font-weight="bold" fill="#1b1f24" text-anchor="start" >RUDP packet on the wire</text>
<rect x="60" y="782" width="110" height="36" rx="4" fill="#dde1e7" stroke="#6b7480" stroke-width="1.2" />
<text x="115.0" y="805" font-size="12.5" font-weight="bold" fill="#1b1f24" text-anchor="middle" >Ethernet</text>
<rect x="170" y="782" width="90" height="36" rx="4" fill="#c9d8f0" stroke="#6b7480" stroke-width="1.2" />
<text x="215.0" y="805" font-size="12.5" font-weight="bold" fill="#1b1f24" text-anchor="middle" >IPv4</text>
<rect x="260" y="782" width="90" height="36" rx="4" fill="#b3cdf0" stroke="#6b7480" stroke-width="1.2" />
<text x="305.0" y="805" font-size="12.5" font-weight="bold" fill="#1b1f24" text-anchor="middle" >UDP</text>
<rect x="350" y="782" width="300" height="36" rx="4" fill="#9cc0f0" stroke="#6b7480" stroke-width="1.2" />
<text x="500.0" y="805" font-size="12.5" font-weight="bold" fill="#1b1f24" text-anchor="middle" >RUDP header 32 B + SACK (up to 3 x 8 B)</text>
<rect x="650" y="782" width="150" height="36" rx="4" fill="#e8f0fc" stroke="#6b7480" stroke-width="1.2" />
<text x="725.0" y="805" font-size="12.5" font-weight="bold" fill="#1b1f24" text-anchor="middle" >Payload up to 1200 B</text>
<text x="60" y="842" font-size="11.5" font-weight="normal" fill="#3b4148" text-anchor="start" >Header fields: version, flags (SYN/ACK/FIN/DATA/RST), connection ID, sequence, ack, window, length, timestamp, echo, CRC32, SACK count</text>
<rect x="830" y="740" width="740" height="235" rx="10" fill="#ffffff" stroke="#c9ced6" stroke-width="1.5" />
<text x="850" y="766" font-size="16" font-weight="bold" fill="#1b1f24" text-anchor="start" >Addressing plan</text>
<rect x="842" y="775" width="716" height="24" rx="3" fill="#e9edf3" stroke="none" stroke-width="0" />
<text x="850" y="792" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start" >Node</text>
<text x="910" y="792" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start" >Interface IP</text>
<text x="1110" y="792" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start" >Subnet</text>
<text x="1190" y="792" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start" >Role / port</text>
<text x="850" y="817" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start" >h1</text>
<text x="910" y="817" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start" >10.0.1.10/24</text>
<text x="1110" y="817" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start" >A</text>
<text x="1190" y="817" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start" >RUDP sender, UDP -> 9000</text>
<text x="850" y="842" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start" >h3</text>
<text x="910" y="842" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start" >10.0.1.11/24</text>
<text x="1110" y="842" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start" >A</text>
<text x="1190" y="842" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start" >iperf3 client</text>
<text x="850" y="867" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start" >R1</text>
<text x="910" y="867" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start" >10.0.1.1/24, 10.0.2.1/24</text>
<text x="1110" y="867" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start" >A, B</text>
<text x="1190" y="867" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start" >router</text>
<text x="850" y="892" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start" >R2</text>
<text x="910" y="892" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start" >10.0.2.2/24, 10.0.3.1/24</text>
<text x="1110" y="892" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start" >B, C</text>
<text x="1190" y="892" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start" >router</text>
<text x="850" y="917" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start" >h2</text>
<text x="910" y="917" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start" >10.0.3.10/24</text>
<text x="1110" y="917" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start" >C</text>
<text x="1190" y="917" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start" >RUDP receiver, UDP 9000</text>
<text x="850" y="942" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start" >h4</text>
<text x="910" y="942" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start" >10.0.3.11/24</text>
<text x="1110" y="942" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start" >C</text>
<text x="1190" y="942" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start" >iperf3 server, TCP 5201</text>
<text x="850" y="968" font-size="11.5" font-weight="normal" fill="#3b4148" text-anchor="start" >Routes: h1,h3 default via 10.0.1.1; h2,h4 default via 10.0.3.1; R1: 10.0.3.0/24 via 10.0.2.2; R2: 10.0.1.0/24 via 10.0.2.1</text>
<text x="60" y="905" font-size="14" font-weight="bold" fill="#1b1f24" text-anchor="start" >Routing: static (no routing protocol)</text>
<text x="60" y="905" font-size="1" font-weight="normal" fill="#1b1f24" text-anchor="middle" ></text>
<text x="60" y="930" font-size="13" font-weight="normal" fill="#3b4148" text-anchor="start" >Subnets A and C are shared LANs (switches sA, sC); subnet B is the point-to-point R1-R2 link.</text>
<text x="60" y="950" font-size="13" font-weight="normal" fill="#3b4148" text-anchor="start" >Hosts h1-h4 and routers R1-R2 are Linux network namespaces created by Mininet.</text>
<text x="60" y="970" font-size="13" font-weight="normal" fill="#3b4148" text-anchor="start" >Default experiment: RTT 100 ms, 10 Mbit/s, 0% loss; one variable changes per experiment.</text>
</svg>