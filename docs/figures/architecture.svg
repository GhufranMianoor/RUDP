</defs>
<rect width="1600" height="1010" fill="#ffffff"/>
<text x="800.0" y="38" font-size="26" font-weight="bold" fill="#1b1f24" text-anchor="middle" >Network Architecture and Addressing Plan</text>
<text x="800.0" y="62" font-size="15" font-weight="normal" fill="#4a5058" text-anchor="middle" >Reliable transport over UDP (RUDP) vs TCP across a routed 2-router, 3-subnet Mininet topology</text>
<rect x="30" y="90" width="450" height="470" rx="14" fill="#f4f8fd" stroke="#7aa2d6" stroke-width="2" stroke-dasharray="8 6"/>
<text x="255.0" y="118" font-size="18" font-weight="bold" fill="#1f4f94" text-anchor="middle" >Subnet A: 10.0.1.0/24</text>
<text x="255.0" y="138" font-size="13" font-weight="normal" fill="#4a5058" text-anchor="middle" >(shared Ethernet LAN)</text>
<rect x="1120" y="90" width="450" height="470" rx="14" fill="#f4f8fd" stroke="#7aa2d6" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1345.0" y="118" font-size="18" font-weight="bold" fill="#1f4f94" text-anchor="middle" >Subnet C: 10.0.3.0/24</text>
<text x="1345.0" y="138" font-size="13" font-weight="normal" fill="#4a5058" text-anchor="middle" >(shared Ethernet LAN)</text>
<rect x="700" y="235" width="220" height="200" rx="14" fill="#fff8ef" stroke="#e0a45f" stroke-width="2" stroke-dasharray="8 6"/>
<text x="810" y="258" font-size="17" font-weight="bold" fill="#9a5410" text-anchor="middle" >Subnet B: 10.0.2.0/24</text>
<text x="810" y="277" font-size="13" font-weight="normal" fill="#4a5058" text-anchor="middle" >point-to-point bottleneck</text>
<polyline points="260,215 360,330" fill="none" stroke="#8a8f98" stroke-width="3" stroke-linejoin="round"  />
<polyline points="260,475 360,400" fill="none" stroke="#8a8f98" stroke-width="3" stroke-linejoin="round"  />
<polyline points="450,365 545,365" fill="none" stroke="#8a8f98" stroke-width="3" stroke-linejoin="round"  />
<polyline points="705,365 895,365" fill="none" stroke="#b86a1a" stroke-width="6" stroke-linejoin="round"  />
<polyline points="1055,365 1150,365" fill="none" stroke="#8a8f98" stroke-width="3" stroke-linejoin="round"  />
<polyline points="1250,330 1340,215" fill="none" stroke="#8a8f98" stroke-width="3" stroke-linejoin="round"  />
<polyline points="1250,400 1340,475" fill="none" stroke="#8a8f98" stroke-width="3" stroke-linejoin="round"  />
